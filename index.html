<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b2e20"><meta name="apple-mobile-web-app-capable" content="yes">
<title>KahveDostum</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee7e1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2d241f}
.app{max-width:480px;margin:auto;min-height:100vh;background:#fff}.hero{padding:26px 20px 22px;background:linear-gradient(135deg,#4b2e20,#754c35);color:white;border-radius:0 0 28px 28px}.brand{font-size:13px;opacity:.75}.hero h1{margin:5px 0;font-size:29px}.content{padding:16px 16px 90px}.card{border:1px solid #eadfd6;border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 5px 18px #4b2e2010}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#7c6d64;font-size:13px}.big{font-size:38px;font-weight:900}.ticks{display:flex;gap:8px;margin:16px 0}.tick{flex:1;aspect-ratio:1;border-radius:50%;border:2px solid #d6c5b9;display:flex;align-items:center;justify-content:center;font-weight:800;color:#a38d7d}.tick.on{background:#4b2e20;color:#fff;border-color:#4b2e20}button{width:100%;border:0;border-radius:14px;padding:13px;margin-top:8px;font-weight:800;font-size:15px;background:#4b2e20;color:#fff}button.alt{background:#efe7e0;color:#4b2e20}.badge{padding:7px 10px;border-radius:999px;background:#eee7e1;font-size:12px;font-weight:800}.active{background:#dff0e5;color:#28724b}.coffee{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid #eee}.rank{font-size:22px}.cup{width:45px;height:45px;border-radius:14px;background:#f5eee8;display:flex;align-items:center;justify-content:center;font-size:23px}.coffee b{font-size:15px}input{width:100%;padding:13px;border:1px solid #d8c9bd;border-radius:12px;margin:6px 0;font-size:15px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:#fff;border-top:1px solid #eadfd6;padding:7px;z-index:4}.nav{margin:0;background:#fff;color:#76685f;padding:10px 3px;font-size:11px}.nav.active{color:#4b2e20}.view{display:none}.view.show{display:block}.history{padding:10px 0;border-bottom:1px solid #eee;font-size:13px}.qr{text-align:center;background:#fbf8f5;border:1px dashed #c9b7aa;border-radius:16px;padding:18px}.fakeqr{font-size:65px;line-height:1.1}.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#2d241f;color:white;padding:12px 16px;border-radius:13px;display:none;z-index:10}
</style></head><body><div class="app">
<div class="hero"><div class="brand">☕ KAHVEDOSTUM</div><h1>Hoş geldin<span id="hello"></span>!</h1><div class="brand">Her kahve bir adım, 5 adımda kahve bizden.</div></div>
<div class="content">
<section id="home" class="view show">
<div class="card"><div class="row"><div><div class="muted">Sadakat kartın</div><div class="big" id="counter">0/5</div></div><span id="badge" class="badge">Standart</span></div><div class="ticks" id="ticks"></div><div class="muted" id="reward"></div><button onclick="coffee()">☕ Kahvemi İşle</button><button class="alt" onclick="freeCoffee()">🎁 Ücretsiz Kahvemi Kullan</button></div>
<div class="card"><div class="row"><div><b>⭐ KahveDostum Aboneliği</b><div class="muted">Her kahvede %50 indirim</div></div><b>₺199/ay</b></div><button onclick="sub()" id="subBtn">Abone Ol</button></div>
<div class="card"><h3 style="margin-top:0">🔥 Bu Hafta En Çok Tercih Edilenler</h3>
<div class="coffee"><span class="rank">🥇</span><span class="cup">☕</span><b>Latte</b></div>
<div class="coffee"><span class="rank">🥈</span><span class="cup">☕</span><b>Americano</b></div>
<div class="coffee"><span class="rank">🥉</span><span class="cup">☕</span><b>Cappuccino</b></div>
</div>
<div class="card"><h3 style="margin-top:0">🔳 QR Kodum</h3><div class="qr"><div class="fakeqr">▦ ▦<br>▦ ▦</div><div class="muted">Müşteri kodu: <b id="code"></b></div></div></div>
</section>
<section id="historyView" class="view"><div class="card"><h3>📜 İşlem Geçmişi</h3><div id="history"></div></div></section>
<section id="profile" class="view"><div class="card"><h3>👤 Profil</h3><input id="name" placeholder="Ad Soyad"><input id="phone" placeholder="Telefon"><button onclick="saveProfile()">Kaydet</button></div><div class="card"><b>Abonelik</b><p class="muted" id="subInfo"></p></div></section>
</div><nav><button class="nav active" onclick="go('home',this)">☕ Ana Sayfa</button><button class="nav" onclick="go('historyView',this)">📜 Geçmiş</button><button class="nav" onclick="go('profile',this)">👤 Profil</button></nav></div><div class="toast" id="toast"></div>
<script>
const K="kd_pwa";let s=JSON.parse(localStorage.getItem(K)||'{"ticks":0,"free":0,"sub":false,"name":"","phone":"","code":"KD-1001","history":[]}');
function save(){localStorage.setItem(K,JSON.stringify(s));render()}function msg(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function log(x){s.history.unshift(new Date().toLocaleString("tr-TR")+" — "+x);s.history=s.history.slice(0,30)}
function coffee(){if(s.ticks===4){s.ticks=0;s.free++;log("5. kahve tamamlandı → ücretsiz kahve hakkı");msg("🎉 Ücretsiz kahve kazandın!")}else{s.ticks++;log("Kahve işlendi → "+s.ticks+"/5");msg("☕ "+s.ticks+"/5 tamamlandı")}save()}
function freeCoffee(){if(!s.free){msg("Ücretsiz kahve hakkın yok.");return}s.free--;log("Ücretsiz kahve kullanıldı");save();msg("🎁 Afiyet olsun!")}
function sub(){s.sub=!s.sub;log(s.sub?"Abonelik başlatıldı → %50 indirim":"Abonelik iptal edildi");save();msg(s.sub?"⭐ %50 indirim aktif!":"Abonelik kapatıldı")}
function saveProfile(){s.name=document.getElementById("name").value.trim();s.phone=document.getElementById("phone").value.trim();log("Profil güncellendi");save();msg("Profil kaydedildi")}
function go(id,b){document.querySelectorAll(".view").forEach(x=>x.classList.remove("show"));document.getElementById(id).classList.add("show");document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function render(){document.getElementById("hello").textContent=s.name?", "+s.name:"";document.getElementById("counter").textContent=s.ticks+"/5";document.getElementById("ticks").innerHTML=[0,1,2,3,4].map(i=>`<div class="tick ${i<s.ticks?"on":""}">${i<s.ticks?"✓":i+1}</div>`).join("");document.getElementById("reward").textContent=s.free?`🎁 ${s.free} ücretsiz kahve hakkın var.`:"5 kahve aldığında 1 ücretsiz kahve kazanırsın.";document.getElementById("badge").textContent=s.sub?"%50 İNDİRİM":"Standart";document.getElementById("badge").className="badge "+(s.sub?"active":"");document.getElementById("subBtn").textContent=s.sub?"Aboneliği İptal Et":"₺199/ay Abone Ol";document.getElementById("code").textContent=s.code;document.getElementById("name").value=s.name;document.getElementById("phone").value=s.phone;document.getElementById("subInfo").textContent=s.sub?"Aboneliğin aktif. Her kahvede %50 indirim alırsın.":"Aktif aboneliğin yok.";document.getElementById("history").innerHTML=s.history.length?s.history.map(x=>`<div class="history">${x}</div>`).join(""):"Henüz işlem yok."}render();
</script></body></html>
